# ==============================================================================
# Tmux Configuration - Fast, Distraction-Free & Kanagawa Theme
# ==============================================================================

# --- Prefix Key ---
# Ctrl-a is the cleanest, most ergonomic prefix key (home row, zero strain)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- General Settings ---
set -g default-shell /bin/zsh    # Ensure zsh is used across all tmux sessions
set -s escape-time 0             # 0ms delay on Escape (essential for Neovim)
set -s extended-keys on          # Support extended keys (Ctrl-Shift-Space, etc.)
set -as terminal-features 'kitty*:extkeys'
set -g history-limit 50000       # Large scrollback buffer
set -g mouse on                  # Mouse support for scrolling, selecting, clicking
set -g focus-events on           # Support focus events for editors
set -g renumber-windows on       # Renumber windows automatically when one is closed
set -g base-index 1              # Start window index at 1 (matches keyboard layout)
setw -g pane-base-index 1        # Start pane index at 1

# --- True Color & Terminal Capability ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,kitty:RGB"

# --- Easy Splits (retains current working directory) ---
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Pane Resizing (repeatable with -r) ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Tab / Window Navigation ---
# Alt-n (next window) and Alt-p (previous window) without prefix key
bind -n M-n next-window
bind -n M-p previous-window

# --- Seamless Neovim / Tmux Navigation (Ctrl-h, Ctrl-j, Ctrl-k, Ctrl-l) ---
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# --- Copy Mode (Vim style + smooth clipboard integration) ---
setw -g mode-keys vi
bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R

# Enter copy mode with prefix + Escape or prefix + [
bind Escape copy-mode
bind [ copy-mode

# Visual selection (v for character, Ctrl-v for block)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle

# Yank (y) to system clipboard (auto-detects Wayland vs X11)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "if [ -n \"$WAYLAND_DISPLAY\" ]; then wl-copy; else xclip -in -selection clipboard; fi"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "if [ -n \"$WAYLAND_DISPLAY\" ]; then wl-copy; else xclip -in -selection clipboard; fi"

# Quick reload of config
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# ==============================================================================
# Status Bar & Colors (Kanagawa theme with vibrant red-orange active highlights)
# ==============================================================================
set -g status on
set -g status-interval 2
set -g status-position top
set -g status-justify left

# Theme palette
# Background: #1F1F28 | Foreground: #DCD7BA | Orange Accent: #E58B58 | Dark Gray: #2A2A37
set -g status-style "bg=#1F1F28,fg=#DCD7BA"

# Pane borders
set -g pane-border-style "fg=#2A2A37"
set -g pane-active-border-style "fg=#E58B58"

# Message / Command line
set -g message-style "bg=#2A2A37,fg=#E58B58,bold"

# Left status: Session indicator with clean pill
set -g status-left "#[bg=#E58B58,fg=#1F1F28,bold] #S #[bg=#1F1F28,fg=#E58B58] "
set -g status-left-length 20

# Right status: Clean, distraction-free host and time
set -g status-right "#[fg=#727169]%H:%M #[fg=#2A2A37]| #[fg=#938AA9]#h "
set -g status-right-length 40

# Window tabs: clean and unobtrusive
setw -g window-status-format "#[fg=#727169,bg=#1F1F28] #I:#W "
setw -g window-status-current-format "#[fg=#1F1F28,bg=#FFA066,bold] #I #[fg=#DCD7BA,bg=#2A2A37,bold] #W "
setw -g window-status-separator ""
