# ==============================================================================
# Kitty Configuration - Fast, Distraction-Free & Kanagawa Theme
# ==============================================================================

# --- Shell ---
shell /bin/zsh

# --- Window & Display ---
# Remember window size across restarts
remember_window_size yes
initial_window_width 1920
initial_window_height 1080
# Disable window decorations (top bar / titlebar)
hide_window_decorations yes
# Confirm window close
confirm_os_window_close 0
# Padding
window_padding_width 6

# --- Fonts ---
font_family      JetBrainsMonoNL Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures always

# --- Cursor ---
# Prominent warm red-orange cursor for high visibility
cursor                 #FF6542
cursor_text_color      #1F1F28
cursor_shape           block
cursor_beam_thickness  2.0
cursor_blink_interval  0

# --- Audio & Bell ---
# Bell completely disabled
enable_audio_bell    no
visual_bell_duration 0.0
window_alert_on_bell no

# --- Scrollback & Terminal ---
scrollback_lines 10000
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 3.0

# --- Clipboard Integration ---
clipboard_control write-clipboard write-primary read-clipboard read-primary

# --- URLs ---
url_color #FFA066
url_style curly
detect_urls yes

# ==============================================================================
# Color Scheme: Kanagawa (with enhanced high-visibility red-orange overrides)
# ==============================================================================
background #1F1F28
foreground #DCD7BA
selection_background #2D4F67
selection_foreground #C8C093

# Black
color0 #090618
color8 #727169

# Red (enhanced reddish-orange tone)
color1 #E82424
color9 #FF5D62

# Green
color2  #76946A
color10 #98BB6C

# Yellow / Orange (warm & readable)
color3  #FFA066
color11 #E6C384

# Blue
color4  #7E9CD8
color12 #7FB4CA

# Magenta / Violet
color5  #957FB8
color13 #938AA9

# Cyan
color6  #6A9589
color14 #7AA89F

# White
color7  #C8C093
color15 #DCD7BA

# --- Shortcuts & Key Passthroughs ---
# Forward Ctrl+Enter and Ctrl+Shift+Enter as CSI u sequences to Neovim (prevents Kitty from intercepting with new_window)
map ctrl+enter       send_text all \x1b[13;5u
map ctrl+shift+enter send_text all \x1b[13;6u
